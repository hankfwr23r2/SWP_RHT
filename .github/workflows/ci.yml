# Chạy test và build cho mỗi pull request và mỗi lần push lên main, để biết trước khi merge là code còn chạy được.
# Backend cần một Postgres trống (test contextLoads khởi động cả ứng dụng); service dưới đây dùng đúng tên DB,
# user và mật khẩu mặc định trong application.properties nên không cần đặt thêm biến môi trường.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: horse_transport_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: RaceHorse@2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d horse_transport_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      # npm run build gồm cả oxlint và tsc -b
      - name: Lint, type-check and build
        run: npm run build

  # Test E2E bằng trình duyệt thật. Không có backend: thử các trang khi backend chưa trả lời.
  # Test cần backend và tài khoản (E2E_BACKEND_URL…) tự bỏ qua ở đây, chạy tay trên máy có backend.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
