spring.application.name=RaceHorse_Transport
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Kết nối PostgreSQL. Mặc định là Postgres local chạy bằng `docker compose up -d postgres` (cùng mật khẩu trong docker-compose.yml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/horse_transport_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:RaceHorse@2026}

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================

# In câu lệnh SQL ra console: tắt mặc định vì ghi log mọi câu SQL làm chậm server; cần debug thì đặt SPRING_JPA_SHOW_SQL=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}

# Giữ OpenEntityManagerInView để tránh LazyInitializationException khi serialize entity/DTO
spring.jpa.open-in-view=true

# Lược đồ do Flyway quản lý (src/main/resources/db/migration). Hibernate chỉ kiểm entity khớp với DB, không sửa bảng.
# Không đổi giá trị này và không cho ghi đè bằng biến môi trường (AGENTS.md mục 4).
spring.jpa.hibernate.ddl-auto=validate

# ==========================================
# FLYWAY
# ==========================================
# Mặc định chỉ chạy lược đồ và dữ liệu nền bắt buộc. Máy dev và test thêm dữ liệu mẫu:
# FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed-dev
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.validate-migration-naming=true

server.port=8080
# Nén phản hồi JSON để giao diện tải nhanh hơn
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=2KB
server.servlet.context-path=/api/v1

# SMTP settings for password reset OTP (configure secrets in the deployment environment)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.from=${PASSWORD_RESET_FROM:${MAIL_USERNAME:}}

# Cloudflare Turnstile verification; public form endpoints fail closed if no secret is configured.
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
app.turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

# ==========================================
# CẤU HÌNH JWT (JSON WEB TOKEN)
# ==========================================
# Khóa ký JWT (tối thiểu 32 byte). Bản deploy bắt buộc đặt APP_JWT_SECRET, thiếu thì không khởi động.
# Máy dev chưa đặt thì dùng khóa ngẫu nhiên (config/JwtProperties).
app.jwt.secret=${APP_JWT_SECRET:}
# Thời hạn Access Token: 15 phút (900000 ms)
app.jwt.access-token-expiration-ms=900000
# Thời hạn Refresh Token: 15 ngày (1296000000 ms)
app.jwt.refresh-token-expiration-ms=1296000000
# Cấu hình cookie (chạy local qua HTTP: false/Lax)
app.jwt.cookie-secure=false
app.jwt.cookie-same-site=Lax

# Remote file storage configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ==========================================
# CỔNG THANH TOÁN VNPAY (sandbox mặc định)
# ==========================================
# Mã website (TmnCode) sandbox không bí mật, có sẵn trong mọi link thanh toán
vnpay.tmn-code=${VNPAY_TMN_CODE:I8STLHSB}
# Hash Secret lấy từ email đăng ký sandbox.vnpayment.vn/devreg — CHỈ đặt qua biến môi trường VNPAY_HASH_SECRET, không commit
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# Trang kết quả phía Frontend (Customer Portal)
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}
# Giữ phân công tối đa 5 phút để nhận kết quả cọc trước hạn; không gia hạn link thanh toán.
vnpay.deposit-confirmation-grace-minutes=${VNPAY_DEPOSIT_CONFIRMATION_GRACE_MINUTES:5}
vnpay.quotation-expiry-scan-ms=${VNPAY_QUOTATION_EXPIRY_SCAN_MS:30000}
# Lộ trình xe tải: Valhalla (OSM, 3 nước); máy chủ công khai chỉ để demo/test, chạy thật thì đặt ROUTING_VALHALLA_URL
routing.valhalla.url=${ROUTING_VALHALLA_URL:https://valhalla1.openstreetmap.de}
# Tìm vị trí theo tên (Nominatim, tối đa 1 yêu cầu mỗi giây). Để trống để tắt
routing.geocode.search-url=${GEOCODE_SEARCH_URL:https://nominatim.openstreetmap.org/search}

# Camera evidence is compressed client-side and validated again by the capture API.
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:20MB}

# Chế độ chạy thử trên máy cá nhân kéo theo khóa thử của Turnstile
spring.profiles.group.local-demo=local-turnstile-test

# ==========================================
# CORS
# ==========================================
# Danh sách origin của frontend được gọi API kèm cookie, cách nhau bằng dấu phẩy.
# Bản deploy đặt APP_CORS_ALLOWED_ORIGINS là đúng tên miền frontend, ví dụ https://racehorse.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
