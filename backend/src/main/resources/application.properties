spring.application.name=RaceHorse_Transport
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Thông tin Driver và URL kết nối PostgreSQL (Aiven Cloud)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pg-18cac63e-tranquanlxag1990-1e7b.h.aivencloud.com:25395/defaultdb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================

# Hiển thị câu lệnh SQL trong console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chiến lược tự động tạo/cập nhật bảng (Lựa chọn: none, update, create, create-drop, validate)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Dialect cho PostgreSQL (Hibernate 6)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# ==========================================
# CẤU HÌNH JWT (JSON WEB TOKEN)
# ==========================================
# Secret key 256-bit dùng để ký JWT (Ưu tiên biến môi trường APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Thời hạn Access Token: 15 phút (900000 ms)
app.jwt.access-token-expiration-ms=900000
# Thời hạn Refresh Token: 15 ngày (1296000000 ms)
app.jwt.refresh-token-expiration-ms=1296000000
# Tên cookie lưu trữ refresh token
app.jwt.refresh-cookie-name=refreshToken
# Cấu hình cookie (Local dev dùng false/Lax; Production Vercel+Cloud dùng true/None)
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${APP_JWT_COOKIE_SAME_SITE:Lax}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# Nạp dữ liệu danh mục và tài khoản mẫu khi khởi động (docker-compose bật sẵn)
app.seed-reference-data=${APP_SEED_REFERENCE_DATA:false}
