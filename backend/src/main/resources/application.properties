spring.application.name=RaceHorse_Transport
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Kết nối PostgreSQL. Mặc định là Postgres local chạy bằng `docker compose up -d postgres` (cùng mật khẩu trong docker-compose.yml),
# để chạy trên máy không bao giờ đụng vào DB thật. Bản deploy (Render) đặt SPRING_DATASOURCE_URL/USERNAME/PASSWORD trỏ tới Aiven.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/horse_transport_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:RaceHorse@2026}

# ==========================================
# CẤU HÌNH HIKARICP CONNECTION POOL (Tránh cạn connection khi Render auto-deploy)
# ==========================================
# Giới hạn số connection tối đa mỗi instance (Mặc định 3, có thể ghi đè qua biến DB_MAX_POOL_SIZE)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
# Số connection nhàn rỗi tối thiểu (chỉ giữ 1 connection khi không có tải)
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
# Thời gian chờ lấy connection từ pool (15 giây)
spring.datasource.hikari.connection-timeout=15000
# Thời gian giải phóng connection không dùng để trả lại cho Aiven (30 giây)
spring.datasource.hikari.idle-timeout=30000
# Tuổi thọ tối đa của 1 connection (3 phút, giảm từ 15 phút để tránh connection chết do Aiven tự ngắt)
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:180000}
# Gửi heartbeat giữ kết nối tới Aiven Cloud luôn sống (30 giây)
spring.datasource.hikari.keepalive-time=30000
# Thời gian chờ kiểm tra tính khả dụng của connection (2 giây)
spring.datasource.hikari.validation-timeout=2000
# Phát hiện rò rỉ kết nối nếu transaction bị giữ quá 10 giây
spring.datasource.hikari.leak-detection-threshold=10000

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================

# In câu lệnh SQL ra console: tắt mặc định vì ghi log mọi câu SQL làm chậm server; cần debug thì đặt SPRING_JPA_SHOW_SQL=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}

# Tối ưu hóa khởi động: Khởi tạo lười (lazy initialization) giúp giảm tải CPU & RAM lúc boot
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:true}

# Giữ OpenEntityManagerInView để tránh LazyInitializationException khi serialize entity/DTO
spring.jpa.open-in-view=true

# Chiến lược tự động tạo/cập nhật bảng (Lựa chọn: none, update, create, create-drop, validate)
# Mặc định 'update' để tự động cập nhật/bổ sung các cột mới vào database Aiven PostgreSQL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Dialect cho PostgreSQL (Hibernate 6)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
# Render tự gắn RENDER_GIT_COMMIT khi build; /health trả lại giá trị này
app.commit=${RENDER_GIT_COMMIT:unknown}
server.servlet.context-path=/api/v1

# SMTP settings for password reset OTP (configure secrets in the deployment environment)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.from=${PASSWORD_RESET_FROM:${MAIL_USERNAME:}}

# ==========================================
# CẤU HÌNH JWT (JSON WEB TOKEN)
# ==========================================
# Secret key 256-bit dùng để ký JWT (Ưu tiên biến môi trường APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Thời hạn Access Token: 15 phút (900000 ms)
app.jwt.access-token-expiration-ms=900000
# Thời hạn Refresh Token: 15 ngày (1296000000 ms)
app.jwt.refresh-token-expiration-ms=1296000000
# Tên cookie lưu trữ refresh token
app.jwt.refresh-cookie-name=refreshToken
# Cấu hình cookie (Local dev dùng false/Lax; Production Vercel+Cloud dùng true/None)
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${APP_JWT_COOKIE_SAME_SITE:Lax}

# Remote file storage configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# Nạp dữ liệu danh mục và tài khoản mẫu khi khởi động (docker-compose bật sẵn)
app.seed-reference-data=${APP_SEED_REFERENCE_DATA:false}

