# Profile cho test tích hợp (@PostgresIntegrationTest). Datasource do Testcontainers cấp (@ServiceConnection).
# Nạp thêm dữ liệu mẫu để test có tài khoản, mạng lưới, tuyến, bảng giá.
spring.flyway.locations=classpath:db/migration,classpath:db/seed-dev
# Khởi tạo mọi bean ngay khi chạy test, để contextLoads bắt được lỗi cấu hình và lỗi truy vấn repository
spring.main.lazy-initialization=false
