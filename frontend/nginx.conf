server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Hỗ trợ định tuyến Single Page App cho Backoffice (/backoffice)
    location /backoffice {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /backoffice.html;
    }

    # Chuyển tiếp các request API đến Backend container
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve .mjs files với đúng MIME type (cần cho MapLibre GL worker)
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Các trang khách hàng trả về index.html
    # Trang HTML luôn hỏi lại máy chủ để nhận bản build mới; file trong /assets có tên theo nội dung nên cache lâu được
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
