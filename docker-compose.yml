services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: racehorse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: horse_transport_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: RaceHorse@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d horse_transport_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Spring Boot 3
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: racehorse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/horse_transport_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=RaceHorse@2026
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_BOOTSTRAP_ADMIN_USERNAME=${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      - APP_BOOTSTRAP_ADMIN_EMAIL=${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

  # 3. Frontend React 19 + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: racehorse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
