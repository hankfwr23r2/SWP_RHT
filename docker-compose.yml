services:
  # 1. Cơ sở dữ liệu PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: racehorse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: horse_transport_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: RaceHorse@2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d horse_transport_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Xem bảng và dữ liệu Postgres local trên web: http://localhost:5050 (không cần đăng nhập pgAdmin;
  # máy chủ "RaceHorse local" đã khai báo sẵn, lần đầu mở nhập mật khẩu DB ở trên và chọn lưu mật khẩu)
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: racehorse-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@example.com
      PGADMIN_DEFAULT_PASSWORD: RaceHorse@2026
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin

  # 2. Backend Spring Boot 3
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: racehorse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/horse_transport_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=RaceHorse@2026
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-MYSGBPBNJVXYCAIIUKOQSONTIDUQMXWN}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:5173/payment/vnpay-return}
      - APP_SEED_REFERENCE_DATA=${APP_SEED_REFERENCE_DATA:-true}
      - APP_BOOTSTRAP_ADMIN_USERNAME=${APP_BOOTSTRAP_ADMIN_USERNAME:-}
      - APP_BOOTSTRAP_ADMIN_EMAIL=${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-iilidnvx}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-131447179186941}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-87frtq4puAKxJwb5PcqEMe1kUyw}
    ports:
      - "8080:8080"

  # 3. Frontend React 19 + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: racehorse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  pgadmin_data:

